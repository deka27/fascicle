<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fascicle</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a65; --line: #e4e1d8;
    --card: #ffffff; --accent: #2f5d8a; --on-accent: #ffffff; --flash: #fff1cc; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --fg: #eceae4; --muted: #9a978f; --line: #2e2d2a;
      --card: #1d1c1a; --accent: #8db4dc; --on-accent: #151514; --flash: #3b3322; --error: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 80px; }
  h1 { font: 600 30px/1.2 Georgia, "Times New Roman", serif; margin: 0; }
  .tagline { color: var(--muted); margin: 4px 0 28px; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; padding: 12px 14px; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 0 18px; font: inherit; font-weight: 600; color: var(--on-accent);
    background: var(--accent); border: 0; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .examples button {
    padding: 4px 12px; font-size: .8rem; font-weight: 400; color: var(--muted);
    background: none; border: 1px solid var(--line); border-radius: 999px;
  }
  .examples button:hover:not(:disabled) { color: var(--fg); border-color: var(--muted); }
  #status { color: var(--muted); margin: 32px 0 0; min-height: 1.6em; }
  #status.error { color: var(--error); }
  #status.busy::before, .caret {
    content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 10px;
    border-radius: 50%; background: var(--accent); vertical-align: middle;
    animation: pulse .9s ease-in-out infinite alternate;
  }
  .caret { margin: 0 0 0 4px; }
  @keyframes pulse { from { opacity: .25; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { #status.busy::before, .caret { animation: none; } }
  #answer { white-space: pre-wrap; margin-top: 4px; }
  .cite { color: var(--accent); font-size: .78em; font-weight: 600; vertical-align: super; text-decoration: none; }
  .cite:hover { text-decoration: underline; }
  h2 { font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 40px 0 10px; }
  ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  li {
    padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    scroll-margin-top: 16px; transition: background-color .4s;
  }
  li.flash { background: var(--flash); }
  .ref .n { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .where { color: var(--muted); font-size: .8rem; }
  summary { cursor: pointer; color: var(--muted); font-size: .8rem; margin-top: 4px; }
  details p { color: var(--muted); margin: 6px 0 2px; }
</style>
</head>
<body>
<main>
  <h1>Fascicle</h1>
  <p class="tagline">Ask the tractography and diffusion-MRI literature. Every answer cites its sources.</p>

  <form id="ask">
    <input id="question" name="question" maxlength="2000" autocomplete="off" required
           placeholder="e.g. Why can't DTI resolve crossing fibres?" aria-label="Question">
    <button id="submit">Ask</button>
  </form>
  <div class="examples">
    <button type="button">How does probabilistic tracking differ from deterministic tracking?</button>
    <button type="button">What is Q-ball imaging?</button>
    <button type="button">How does constrained spherical deconvolution work?</button>
  </div>

  <p id="status" role="status"></p>
  <div id="answer" aria-live="polite"></div>

  <section id="sources" hidden>
    <h2>Sources</h2>
    <ol id="list"></ol>
  </section>
</main>

<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  // Escape first: the model's text and the PDF passages are untrusted.
  const render = (text) => esc(text)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[(\d+)\]/g, '<a class="cite" href="#src-$1" data-n="$1">[$1]</a>');

  // Waiting stages ("Searching…", "Thinking…") show a pulsing dot and, after 2s, the elapsed time.
  let stage = "", started = 0, timer = null;

  function setStage(label) {
    stage = label;
    if (!timer) { started = Date.now(); timer = setInterval(drawStage, 1000); }
    $("#status").className = "busy";
    drawStage();
  }

  function drawStage() {
    const s = Math.floor((Date.now() - started) / 1000);
    $("#status").textContent = stage + (s >= 2 ? ` · ${s}s` : "");
  }

  function setStatus(text, isError = false) {
    clearInterval(timer);
    timer = null;
    $("#status").textContent = text;
    $("#status").className = isError ? "error" : "";
  }

  function setBusy(busy) {
    document.querySelectorAll("button").forEach((b) => (b.disabled = busy));
  }

  function showSources(sources) {
    $("#list").innerHTML = sources.map((s, i) => `
      <li id="src-${i + 1}">
        <div class="ref"><span class="n">[${i + 1}]</span>${esc(s.authors)} (${esc(s.year)}). <i>${esc(s.title)}</i>. ${esc(s.journal)}.</div>
        <div class="where">${esc(s.section)} · p. ${esc(s.page)}</div>
        <details><summary>Show passage</summary><p>${esc(s.text)}</p></details>
      </li>`).join("");
    $("#sources").hidden = false;
  }

  async function ask(question) {
    setBusy(true);
    setStage("Searching the papers…");
    $("#answer").innerHTML = "";
    $("#sources").hidden = true;
    let text = "";
    try {
      const res = await fetch("/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      if (!res.ok) throw new Error(res.status === 422 ? "Please enter a question (up to 2000 characters)." : `Server error (${res.status}).`);

      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        const events = buffer.split("\n\n");
        buffer = events.pop(); // keep a partial event for the next read
        for (const event of events) {
          const data = JSON.parse(event.replace(/^data: /, ""));
          if (data.error) throw new Error(data.error);
          if (data.sources) { showSources(data.sources); setStage(`Reading ${data.sources.length} sources…`); }
          if (data.status === "thinking") setStage("Thinking it through…");
          if (data.token) {
            if (!text) setStatus(""); // first token: the wait is over
            text += data.token;
            $("#answer").innerHTML = render(text) + '<span class="caret"></span>';
          }
        }
      }
      if (!text) throw new Error("No answer came back. Check the server logs.");
      $("#answer").innerHTML = render(text);
    } catch (err) {
      setStatus(err.message === "Failed to fetch" ? "Can't reach the server. Is uvicorn running?" : err.message, true);
    } finally {
      setBusy(false);
    }
  }

  $("#ask").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = $("#question").value.trim();
    if (q) ask(q);
  });

  document.querySelectorAll(".examples button").forEach((b) =>
    b.addEventListener("click", () => { $("#question").value = b.textContent; ask(b.textContent); }));

  // Clicking [n] scrolls to that source and briefly highlights it.
  $("#answer").addEventListener("click", (e) => {
    const cite = e.target.closest(".cite");
    if (!cite) return;
    e.preventDefault();
    const card = $(`#src-${cite.dataset.n}`);
    if (!card) return;
    card.scrollIntoView({ behavior: "smooth", block: "center" });
    card.classList.add("flash");
    setTimeout(() => card.classList.remove("flash"), 1200);
  });
</script>
</body>
</html>
